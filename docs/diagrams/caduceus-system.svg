<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1860" viewBox="0 0 2400 1860" role="img" aria-labelledby="title desc"><title id="title">Caduceus — system communication map</title><desc id="desc">Hermes and other MCP clients communicate through caduceus-mcp and a local HTTP control API with a requester daemon. The CLI uses the same control API. Symmetric daemons exchange tasks, cancellation, events, results and worker status over Noise-secured libp2p. Each daemon can execute prompt work using an OpenAI-compatible model backend and persists local state. LAN mDNS discovers peer addresses; peer trust is enforced separately.</desc>
